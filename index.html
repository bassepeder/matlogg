<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Matlogg</title>
    <meta name="description" content="Personal food and calorie diary" />
    <meta name="theme-color" content="#f4f5f2" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/pwa-192x192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/pwa-512x512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Matlogg" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const theme = localStorage.getItem('matlogg.theme');
        if (theme) document.documentElement.dataset.theme = theme;
        const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0e1110' : '#f4f5f2';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
